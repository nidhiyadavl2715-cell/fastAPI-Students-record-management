<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registry</title>
  <link rel="stylesheet" href="style.css">   <!-- design (colors, layout) -->
</head>
<body>
  <header>
    <h1>🎓 Student Registry</h1>
    <p>HTML + JS UI &rarr; FastAPI &rarr; student.json</p>
  </header>

  <main>
    <!-- The 3 stat cards at the top: JavaScript fills them in -->
    <section class="stats">
      <div class="card"><span id="stat-total">0</span><small>Total students</small></div>
      <div class="card"><span id="stat-avg">0</span><small>Average marks</small></div>
      <div class="card"><span id="stat-courses">0</span><small>Courses</small></div>
    </section>

    <!-- Message box: success / error messages appear here -->
    <div id="message" class="message" hidden></div>

    <!-- Add / Edit form (the same form is used for both) -->
    <section class="panel">
      <h2 id="form-title">Add a new student</h2>
      <form id="student-form" novalidate>
        <label>ID
          <input id="f-id" type="text" placeholder="s004" required>
        </label>
        <label>Name
          <input id="f-name" type="text" placeholder="Neha Rao" required>
        </label>
        <label>Age
          <input id="f-age" type="number" min="0" max="100" value="18" required>
        </label>
        <label>Course
          <input id="f-course" type="text" placeholder="Physics" required>
        </label>
        <label>Marks
          <input id="f-marks" type="number" min="0" max="100" step="0.5" value="0" required>
        </label>
        <label>Email (optional)
          <input id="f-email" type="email" placeholder="neha@example.com">
        </label>
        <div class="actions">
          <button type="submit" id="submit-btn">Add student</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <!-- Search / sort controls -->
    <section class="panel">
      <h2>Students</h2>
      <div class="toolbar">
        <input id="filter-course" type="text" placeholder="Search by course (e.g. Physics)">
        <button id="filter-btn" type="button">Search</button>
        <select id="sort-field">
          <option value="">Sort by...</option>
          <option value="marks">Marks</option>
          <option value="age">Age</option>
          <option value="name">Name</option>
        </select>
        <select id="sort-order">
          <option value="asc">Ascending</option>
          <option value="dec">Descending</option>
        </select>
        <button id="reset-btn" type="button" class="secondary">Reset</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Age</th><th>Course</th>
              <th>Marks</th><th>Grade</th><th>Email</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="students-body"></tbody>   <!-- rows are added by JavaScript -->
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>   <!-- logic (API calls) -->
</body>
</html>
